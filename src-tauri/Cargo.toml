[package]
name = "elementary"
version = "0.1.0"
description = "Elementary: a story-driven role-playing game and story designer"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "elementary_lib"
# "cdylib" is only needed for Android; it is omitted because the windows-gnu linker
# fails with "export ordinal too large" once the DLL exceeds 65535 exports.
crate-type = ["staticlib", "rlib"]

[features]
# Keeps the app's data in a `data` folder next to the executable instead of the app data directory.
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1.27.0", features = ["v4"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
